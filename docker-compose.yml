version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: designtwg-postgres-16
    restart: unless-stopped
    environment:
      POSTGRES_DB: designtwg_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - twg_pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d designtwg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  twg_pgdata:
    driver: local
